<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual RAG · Evidence-first answers</title>
  <script>
    // Synchronous theme init before first paint to prevent a dark/light flash.
    (function () {
      try {
        var saved = localStorage.getItem("vrag_theme");
        var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = saved === "light" || saved === "dark" ? saved : (prefersLight ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
      } catch (_) { /* Storage may be disabled; keep the default. */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://rsms.me/" crossorigin />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
</head>
<body>
  <aside class="sidebar" aria-label="Workspace">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path fill="url(#g)" d="M6 4h13l7 7v17a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Zm12 2v6h6l-6-6ZM9 17h14v2H9v-2Zm0 5h10v2H9v-2Z"/></svg>
      </div>
      <div class="brand-text">
        <h1>Visual&nbsp;RAG</h1>
        <p>Evidence-first answering</p>
      </div>
      <!--
        Icon swap is now pure-CSS: html[data-theme] shows/hides the matching
        svg below, so app.js only needs to flip document.documentElement.dataset.theme
        (it already does this) and, ideally, also set aria-pressed — see the
        JS snippet provided alongside these files.
      -->
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <div class="status-bar" role="status" aria-live="polite">
      <span id="statusDot" class="status-dot" aria-hidden="true"></span>
      <span id="statusText">connecting…</span>
    </div>

    <p id="bootStatus" class="boot-status" hidden></p>

    <button id="newChat" class="primary-btn" type="button" data-navigation>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New chat
    </button>

    <section class="panel" aria-label="Upload">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Upload a PDF (or press Enter to browse files)" aria-busy="false">
        <div class="dz-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
        </div>
        <p class="dz-title">Drop a PDF to ingest</p>
        <p class="dz-hint">or</p>
        <label id="uploadLabel" class="ghost-btn" for="fileInput">Browse files</label>
        <input id="fileInput" type="file" accept="application/pdf" hidden />
        <p class="dz-fine">PDF · up to 50&nbsp;MB · 300 pages</p>
        <div id="dzProgress" class="dz-progress" hidden>
          <progress id="dzBar" max="100"></progress>
          <p id="dzText" class="dz-text"></p>
        </div>
      </div>
    </section>

    <section class="panel scroll-panel" aria-label="Documents">
      <div class="panel-head">
        <h2>Documents</h2>
        <div class="panel-actions">
          <button id="compareBtn" class="small-btn" type="button" data-navigation title="Compare two versions">Compare</button>
          <button id="refreshDocs" class="small-btn" type="button" title="Refresh document list">Refresh</button>
        </div>
      </div>
      <div class="scope-row">
        <label class="field">
          <span>Versions</span>
          <select id="versionMode" data-navigation>
            <option value="latest">Latest per file</option>
            <option value="all">All ready versions</option>
          </select>
        </label>
        <button id="clearScope" class="small-btn" type="button" data-navigation>Clear scope</button>
      </div>
      <p id="scopeChip" class="scope-chip" hidden></p>
      <ul id="docList" class="doc-list"></ul>
    </section>

    <section class="panel scroll-panel" aria-label="Conversations">
      <div class="panel-head"><h2>Conversations</h2></div>
      <ul id="convList" class="conv-list"></ul>
    </section>

    <details class="panel usage-panel">
      <summary>Tenant usage</summary>
      <div id="usage" class="usage"></div>
    </details>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb">
        <h2 class="crumb-label">Chat</h2>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span id="crumb" class="crumb-value">New chat</span>
      </div>
      <div class="topbar-actions">
        <button id="exportBtn" class="small-btn" type="button" data-navigation title="Export conversation as Markdown">Export</button>
      </div>
    </header>

    <div class="chat-scroll">
      <section id="chat" class="chat" role="log" aria-live="polite" aria-relevant="additions" aria-atomic="false" aria-label="Conversation"></section>

      <button id="jumpLatest" class="jump-latest" type="button" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        New messages
      </button>
    </div>

    <div class="composer">
      <div id="streamStatus" class="stream-status" role="status" aria-live="polite"></div>
      <div class="composer-inner">
        <textarea id="prompt" rows="1" placeholder="Ask a question grounded in your documents…" aria-label="Question"></textarea>
        <div class="composer-actions">
          <button id="stopBtn" class="ghost-btn danger" type="button" hidden>Stop</button>
          <button id="sendBtn" class="primary-btn send-btn" type="button" aria-label="Send question">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14-7-5 14-3-6-6-1Z"/></svg>
            <span>Send</span>
          </button>
        </div>
      </div>
      <p class="composer-fine">Answers are shown only after citation and grounding checks. The model may abstain.</p>
    </div>
  </main>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-surface">
      <header class="modal-head">
        <h2 id="modalTitle">Details</h2>
        <button id="modalClose" class="icon-btn" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
